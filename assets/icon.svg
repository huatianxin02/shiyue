    </g>
    <text x="-120" y="-46" font-family="Songti SC, STSong, serif" font-size="174" font-weight="600" fill="#26786A">拾</text>
    <g fill="#D2E4DA">
      <rect x="-120" y="54" width="240" height="18" rx="9"/>
