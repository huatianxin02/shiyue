name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: bash build-app.sh
      - run: npm ci
      - run: npm test
      - name: Python regressions using bundled runtime
        run: |
          export SHIYUE_TEST_APP="$PWD/拾页资料库.app"
          '拾页资料库.app/Contents/Resources/python/bin/python3' -B -m unittest discover -s tests -v
      - name: Portable Agent integration
        run: "'拾页资料库.app/Contents/Resources/python/bin/python3' -B agent-kit/shiyue_agent.py --app \"$PWD/拾页资料库.app\" self-test"
      - name: Public release privacy gate
        run: python3 tools/public_release.py --check
      - name: Build public archives
        run: python3 tools/public_release.py --source --app --output dist
