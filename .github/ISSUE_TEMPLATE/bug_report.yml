name: 缺陷报告
description: 提交可复现的问题，不附个人资料或凭证
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 拾页版本、macOS 版本与芯片
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤、预期结果与实际结果
      description: 使用自制测试文件；不要粘贴访问令牌、数据库或真实资料正文。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的错误信息
      description: 若属于安全漏洞，请按 SECURITY.md 私下报告。
